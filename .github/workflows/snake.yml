name: Generate Contribution Snake

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *" 
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Naman0911
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#2d3343,#0891B2,#22D3EE,#A78BFA,#10B981
            dist/github-contribution-grid-snake.svg?color_dots=#ebedf0,#0891B2,#22D3EE,#7C3AED,#10B981

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
